name: Shadow scan (live, market data only)

# Dispatched by the Cloudflare Worker `gainers-shadow-trigger` on a 15-minute ET grid
# (see docs/shadow-mode-v1.md). Never places orders; no account/positions/orders endpoints.
on:
  workflow_dispatch:
    inputs:
      job:
        description: universe | snapshot | rank | outcomes | summary
        required: true
        type: choice
        options: [universe, snapshot, rank, outcomes, summary]
      date:
        description: ET session date (YYYY-MM-DD); blank = today in America/New_York
        required: false
        default: ""
      cutoff:
        description: Data cutoff HH:MM ET (snapshot 07:00/08:00/09:00/09:15, rank 09:30/09:45/10:00)
        required: false
        default: ""
      force:
        description: Re-run even if outputs exist (writes .rerun-<id> copies, never overwrites)
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # push append-only logs to the shadow-data branch only

# No workflow-level `concurrency` group on purpose: GitHub keeps only ONE pending run per group and
# cancels older pending ones, which would silently drop slots. Overlapping runs are safe because each
# job writes unique file names and the push step rebases + retries.

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APCA_API_KEY_ID: ${{ secrets.SHADOW_ALPACA_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.SHADOW_ALPACA_SECRET_KEY }}
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      JOB: ${{ inputs.job }}
      DAY: ${{ inputs.date }}
      CUTOFF: ${{ inputs.cutoff }}
      DATA_BRANCH: shadow-data
      SHADOW_ARTIFACT_DIR: shadow-artifacts
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out shadow-data branch (create orphan if missing)
        run: |
          echo "DAY_RESOLVED=${DAY:-$(TZ=America/New_York date +%F)}" >> "$GITHUB_ENV"
          git config user.name "gainers-shadow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --no-tags origin "$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            git worktree add -B "$DATA_BRANCH" shadow-data "origin/$DATA_BRANCH"
          else
            git worktree add --orphan -b "$DATA_BRANCH" shadow-data
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt

      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt

      - name: Run shadow job
        run: |
          args=(--job "$JOB" --data-root shadow-data)
          args+=(--date "$DAY_RESOLVED")
          [ -n "$CUTOFF" ] && args+=(--cutoff "$CUTOFF")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          python scripts/shadow_run.py "${args[@]}"

      - name: Commit and push logs (append-only, rebase + retry)
        if: always()
        working-directory: shadow-data
        run: |
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "shadow: ${JOB} ${DAY_RESOLVED} ${CUTOFF} run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push -q origin "HEAD:$DATA_BRANCH"; then echo "pushed on attempt $attempt"; exit 0; fi
            sleep $(( (RANDOM % 10) + 3 * attempt ))
            git fetch -q --no-tags origin "$DATA_BRANCH" && git rebase -q "origin/$DATA_BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Upload full feature tables + day logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-${{ inputs.job }}-${{ env.DAY_RESOLVED }}-${{ github.run_id }}
          path: |
            shadow-artifacts/
            shadow-data/shadow/${{ env.DAY_RESOLVED }}/
          if-no-files-found: ignore
          retention-days: 90
