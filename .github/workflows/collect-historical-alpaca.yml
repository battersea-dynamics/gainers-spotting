name: Collect historical Alpaca bars

on:
  workflow_dispatch:
    inputs:
      research_date:
        description: U.S. market date (YYYY-MM-DD)
        required: true
        default: "2026-07-24"
      universe_file:
        description: Optional tracked universe JSON; auto-detected by date when blank
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-historical-alpaca.yml"
      - "scripts/collect_alpaca_bars.py"
      - "config/research-universes/**"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY || secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.APCA_API_SECRET_KEY }}
      RESEARCH_DATE: ${{ inputs.research_date || '2026-07-24' }}
      INPUT_UNIVERSE_FILE: ${{ inputs.universe_file || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run collector
        id: collect
        shell: bash
        run: |
          universe_file="$INPUT_UNIVERSE_FILE"
          if [[ -z "$universe_file" && -f "config/research-universes/$RESEARCH_DATE.json" ]]; then
            universe_file="config/research-universes/$RESEARCH_DATE.json"
          fi
          args=(--date "$RESEARCH_DATE")
          if [[ -n "$universe_file" ]]; then
            args+=(--universe-file "$universe_file")
          fi
          python scripts/collect_alpaca_bars.py "${args[@]}"

      - name: Upload research dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-research-${{ env.RESEARCH_DATE }}
          path: data/research/${{ env.RESEARCH_DATE }}/
          if-no-files-found: error
          retention-days: 30
